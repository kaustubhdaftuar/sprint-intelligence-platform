apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sprint-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sprint-platform.example.com
    secretName: sprint-platform-tls
  rules:
  - host: sprint-platform.example.com
    http:
      paths:
      # Frontend routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      # API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 4000
      # AI Service routes (internal only - optional exposure)
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 5000
---
# Local development ingress (for minikube/kind)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sprint-platform-local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: sprint-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 4000