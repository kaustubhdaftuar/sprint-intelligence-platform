apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: sprint-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              value: "mongodb://admin:changeme-in-production@mongodb-service:27017/sprint-intelligence?authSource=admin"
            - name: REDIS_URL
              value: "redis://:redis-password-change-me@redis-service:6379"
            - name: JWT_ACCESS_SECRET
              value: "this_is_a_super_long_access_secret_key_123456789y"
            - name: JWT_REFRESH_SECRET
              value: "this_is_a_super_long_refresh_secret_key_987654321"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
